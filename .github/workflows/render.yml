name: Generate Reel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Generate Reel Video
        run: python make_reel.py

      - name: Release MP4 Directly
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-reel
          name: Latest UGC Reel
          files: learnthrill_promo_reel.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
