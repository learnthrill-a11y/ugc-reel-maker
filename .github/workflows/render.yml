name: Generate Reel

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Generate Reel Video
        run: python make_reel.py

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: ugc-promo-reel
          path: learnthrill_promo_reel.mp4
